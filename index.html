<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>收集星星小游戏</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f3efe4;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            color: #222;
        }

        .game-wrapper {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .info {
            margin-bottom: 16px;
            font-size: 18px;
        }

        #score {
            font-weight: bold;
            font-size: 24px;
        }

        #game {
            position: relative;

            width: 640px;
            height: 420px;

            max-width: 90vw;

            background: white;

            border: 4px solid #222;
            border-radius: 12px;

            overflow: hidden;
        }

        /* 玩家角色 */
        #player {
            position: absolute;

            width: 64px;
            height: 64px;

            left: 40px;
            top: 40px;

            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        /* 星星 */
        #item {
            position: absolute;

            width: 28px;
            height: 28px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;

            user-select: none;
        }

        #message {
            height: 32px;
            margin-top: 12px;

            font-size: 22px;
            font-weight: bold;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>


<body>

<div class="game-wrapper">

    <h1>⭐ 收集星星</h1>

    <div class="info">
        使用
        <strong>方向键 / WASD</strong>
        移动
        &nbsp;｜&nbsp;
        分数：
        <span id="score">0</span>
        / 10
    </div>


    <div id="game">

        <img
            id="player"
            src="https://dbu9btjyfhr28qsx.public.blob.vercel-storage.com/player.png"
            alt="玩家角色"
            draggable="false"
        >

        <div id="item">
            ⭐
        </div>

    </div>


    <div id="message"></div>

    <button onclick="resetGame()">
        重新开始
    </button>

</div>


<script>

    const game =
        document.getElementById("game");

    const player =
        document.getElementById("player");

    const item =
        document.getElementById("item");

    const scoreText =
        document.getElementById("score");

    const message =
        document.getElementById("message");


    // 玩家位置
    let playerX = 40;
    let playerY = 40;

    // 当前分数
    let score = 0;

    // 玩家尺寸
    const playerSize = 64;

    // 星星尺寸
    const itemSize = 28;

    // 每次按键移动距离
    const speed = 20;

    // 胜利目标
    const targetScore = 10;


    function updatePlayer() {

        player.style.left =
            playerX + "px";

        player.style.top =
            playerY + "px";
    }


    function moveItem() {

        const gameWidth =
            game.clientWidth;

        const gameHeight =
            game.clientHeight;


        const maxX =
            gameWidth - itemSize;

        const maxY =
            gameHeight - itemSize;


        const newX =
            Math.floor(
                Math.random() * maxX
            );

        const newY =
            Math.floor(
                Math.random() * maxY
            );


        item.style.left =
            newX + "px";

        item.style.top =
            newY + "px";
    }


    function checkCollision() {

        const playerRect =
            player.getBoundingClientRect();

        const itemRect =
            item.getBoundingClientRect();


        const collided =
            playerRect.left < itemRect.right &&
            playerRect.right > itemRect.left &&
            playerRect.top < itemRect.bottom &&
            playerRect.bottom > itemRect.top;


        if (collided) {

            score++;

            scoreText.textContent =
                score;


            if (score >= targetScore) {

                message.textContent =
                    "🎉 胜利！你收集了所有星星！";

                item.style.display =
                    "none";

            } else {

                moveItem();

            }
        }
    }


    document.addEventListener(
        "keydown",
        function(event) {

            const gameWidth =
                game.clientWidth;

            const gameHeight =
                game.clientHeight;


            const key =
                event.key.toLowerCase();


            if (
                event.key === "ArrowLeft" ||
                key === "a"
            ) {

                playerX -= speed;

            }


            if (
                event.key === "ArrowRight" ||
                key === "d"
            ) {

                playerX += speed;

            }


            if (
                event.key === "ArrowUp" ||
                key === "w"
            ) {

                playerY -= speed;

            }


            if (
                event.key === "ArrowDown" ||
                key === "s"
            ) {

                playerY += speed;

            }


            playerX =
                Math.max(
                    0,
                    Math.min(
                        playerX,
                        gameWidth - playerSize
                    )
                );


            playerY =
                Math.max(
                    0,
                    Math.min(
                        playerY,
                        gameHeight - playerSize
                    )
                );


            updatePlayer();

            checkCollision();


            if (
                event.key.startsWith("Arrow")
            ) {

                event.preventDefault();

            }
        }
    );


    function resetGame() {

        score = 0;

        playerX = 40;
        playerY = 40;


        scoreText.textContent =
            score;

        message.textContent =
            "";

        item.style.display =
            "flex";


        updatePlayer();

        moveItem();
    }


    updatePlayer();

    moveItem();

</script>


</body>

</html>
